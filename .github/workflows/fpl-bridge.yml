name: FPL Bridge Analysis

on:
  push:
    branches: [main]
    paths:
      - bridge_analysis.py
      - .github/workflows/fpl-bridge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn statsmodels
      - run: python bridge_analysis.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge_results.json bridge_panel.csv
          git commit -m "Add FPL bridge analysis results [skip ci]" || exit 0
          git push
